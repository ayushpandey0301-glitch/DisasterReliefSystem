<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Disaster Relief Management System for managing disasters, resources, shelters, vehicles, volunteers and relief requests">

    <meta name="theme-color"
          content="#2563eb">

    <title>
        {% block title %}
        Disaster Relief Management System
        {% endblock %}
    </title>


    <!-- Google Fonts -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap"
          rel="stylesheet">


    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <!-- Font Awesome -->

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
          rel="stylesheet">


    <!-- Main CSS -->

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">


    {% block extra_css %}{% endblock %}


    <!-- ========================================= -->
    <!-- GLOBAL BASE STYLES -->
    <!-- ========================================= -->

    <style>

        /* =========================================
           GLOBAL PAGE STABILITY
           ========================================= */

        html {
            scrollbar-gutter: stable;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Inter", sans-serif;
            background: #f5f7fb;
            color: #1f2937;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        button,
        input,
        select,
        textarea {
            font-family: "Inter", sans-serif;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: "Poppins", sans-serif;
        }


        /* =========================================
           FLASH MESSAGES
           ========================================= */

        .flash-messages {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            width: min(380px, calc(100vw - 40px));
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .flash-message {
            padding: 14px 18px;
            border-radius: 10px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            box-shadow: 0 8px 25px rgba(15, 23, 42, 0.10);
            font-size: 14px;
            font-weight: 500;
            line-height: 1.5;
        }

        .flash-message.success {
            color: #166534;
            border-left: 4px solid #16a34a;
        }

        .flash-message.error {
            color: #b91c1c;
            border-left: 4px solid #dc2626;
        }

        .flash-message.warning {
            color: #92400e;
            border-left: 4px solid #f59e0b;
        }

        .flash-message.info {
            color: #1d4ed8;
            border-left: 4px solid #2563eb;
        }


        /* =========================================
           GLOBAL LINKS
           ========================================= */

        a {
            text-decoration: none;
        }


        /* =========================================
           RESPONSIVE FLASH MESSAGES
           ========================================= */

        @media (max-width: 576px) {

            .flash-messages {
                top: 12px;
                right: 12px;
                width: calc(100vw - 24px);
            }

            .flash-message {
                padding: 12px 14px;
                font-size: 13px;
            }

        }

    </style>

</head>


<body>


    <!-- ========================================= -->
    <!-- FLASH MESSAGES -->
    <!-- ========================================= -->

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}

            <div class="flash-messages">

                {% for category, message in messages %}

                    <div class="flash-message {{ category }}">
                        {{ message }}
                    </div>

                {% endfor %}

            </div>

        {% endif %}

    {% endwith %}



    <!-- ========================================= -->
    <!-- PAGE CONTENT -->
    <!-- ========================================= -->

    {% block content %}

    {% endblock %}



    <!-- ========================================= -->
    <!-- BOOTSTRAP JS -->
    <!-- ========================================= -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


</body>

</html>
