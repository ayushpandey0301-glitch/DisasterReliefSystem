<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | DRRMS</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #111827;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .08);
        }

        h1 {
            margin-top: 0;
            font-size: 25px;
        }

        p {
            color: #6b7280;
            line-height: 1.5;
        }

        label {
            display: block;
            margin: 20px 0 8px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: 0;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        a {
            color: #2563eb;
            text-decoration: none;
        }

        .back {
            display: block;
            margin-top: 20px;
            text-align: center;
        }

        .message {
            padding: 10px;
            margin-bottom: 12px;
            border-radius: 6px;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Set New Password</h1>
        <p>Create a new password for your DRRMS account. Use at least 8 characters.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="message {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.reset_password') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label for="password">New Password</label>
            <input
                id="password"
                type="password"
                name="password"
                minlength="8"
                maxlength="255"
                autocomplete="new-password"
                required
            >

            <label for="confirm_password">Confirm New Password</label>
            <input
                id="confirm_password"
                type="password"
                name="confirm_password"
                minlength="8"
                maxlength="255"
                autocomplete="new-password"
                required
            >

            <button type="submit">Reset Password</button>
        </form>

        <a class="back" href="{{ url_for('auth.login') }}">Back to Login</a>
    </main>
</body>
</html>
